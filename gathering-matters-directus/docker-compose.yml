services:
  directus:
    # Baked-extension image: extensions are compiled from extensions-src and
    # copied into /directus/extensions by the Dockerfile. No extensions bind
    # mount here, so the baked artifacts are what actually run.
    build:
      context: .
    image: gathering-matters-directus:local
    ports:
      - "8055:8055"
    env_file: .env
    volumes:
      - ./uploads:/directus/uploads

  test-runner:
    # Behind the "test" profile so the default `docker compose up -d` neither
    # starts it nor validates its env_file. Without the profile, a missing
    # .env.test aborts every compose command in this project — including
    # bootstrap — even when you only wanted Directus.
    #
    # `docker compose run --rm test-runner` auto-enables this profile, so no
    # --profile flag is needed for the normal test invocation.
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test-runner
    image: gathering-matters-directus-test-runner:local
    env_file: .env.test
    depends_on:
      - directus
